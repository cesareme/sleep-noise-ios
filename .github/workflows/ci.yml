# The gate for main. The job name "verify" is the required status check:
# renaming the job means updating the branch protection rule.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# One run per PR: a newer push cancels the older run. Every push to main gets
# its own group (the commit), so a later merge never cancels an earlier one.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Same Xcode as the integrator's Mac. Bump both together. The job fails if
  # the image drops this version: changing Xcode is a commit, not an accident.
  XCODE_APP: /Applications/Xcode_26.6.app
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_NO_ENV_HINTS: "1"

jobs:
  verify:
    name: verify
    # Pinned image, not macos-latest: the label moves between macOS versions.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Two commits: on a pull request HEAD is the merge commit and HEAD^1
          # is the base branch, which the next step compares against.
          fetch-depth: 2

      # The gate that runs is the one in the PR itself. This does not block; it
      # makes a change to the gate impossible to miss for the reviewer.
      - name: Flag changes to the gate
        if: github.event_name == 'pull_request'
        run: |
          changed="$(git diff --name-only HEAD^1 HEAD -- scripts/ .github/ project.yml)"
          if [ -n "$changed" ]; then
            echo "::warning::This PR changes the gate itself: $(printf '%s' "$changed" | tr '\n' ' ')"
            {
              echo "This PR changes the gate itself (scripts/, .github/ or project.yml). Read these changes first:"
              echo
              printf '%s\n' "$changed" | sed 's/^/- /'
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Select Xcode
        run: |
          if [ ! -d "$XCODE_APP" ]; then
            echo "::error::$XCODE_APP is not on this image. Update XCODE_APP in ci.yml on purpose."
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP"

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          xcrun simctl list devices available

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      # The step timeout is shorter than the job's, so a hung simulator fails
      # this step and the log below is still uploaded.
      - name: Verify
        timeout-minutes: 25
        run: scripts/verify.sh --ci

      - name: Upload verify.log
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-log
          path: .build/verify.log
          # .build is a hidden directory; the path is a single file.
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
